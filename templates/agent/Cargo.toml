[package]
name = "my-agent"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
synapse = { path = "../../", default-features = false, features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.30"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# This Cargo.toml is the template for a Synapse agent that compiles
# to wasm32-wasip2. To bootstrap a new agent:
#
#   cp -r templates/agent my-new-agent
#   cd my-new-agent
#   # Edit Cargo.toml: change `name`, `version`
#   # Edit src/lib.rs: replace placeholders
#   rustup target add wasm32-wasip2
#   cargo build --release --target wasm32-wasip2
#
# The output `.wasm` is loadable by any supervisor implementing the
# WASM Agent ABI documented at ../../docs/wasm-agent-abi.md.
