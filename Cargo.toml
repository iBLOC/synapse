[package]
name = "synapse"
version = "0.1.0"
edition = "2021"
description = "Rust-based intelligent agent development framework"
license = "MIT"
authors = ["Synapse Team"]

[dependencies]
# Logging & tracing
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "1"
anyhow = "1"

# Async traits
async-trait = "0.1"

# Utilities
futures = "0.3"
once_cell = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Pin for async futures
pin-project = "1"

# Type utilities
dashmap = "5"

# Regex for pattern matching
regex = "1"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1"

[features]
default = []
wasm = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full", "sync"] }
reqwest = { version = "0.12", features = ["json"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }
wasi = "0.14"
pollster = "0.4"
