[package]
name = "synapse"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Rust-based intelligent agent development framework"
license = "Apache-2.0"
authors = ["Synapse Contributors"]
repository = "https://github.com/ibloc/synapse"
homepage = "https://ibloc.github.io/synapse/"

[workspace]
members = ["crates/privacy"]
resolver = "3"

[dependencies]
# Outbound PII redaction engine. Lives in its own crate so lean
# consumers (neuron) can take it without pulling synapse's runtime
# dependencies; re-exported as `synapse::privacy`.
synapse-privacy = { path = "crates/privacy" }

# Logging & tracing
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "1"
anyhow = "1"

# Async traits
async-trait = "0.1"

# Utilities
futures = "0.3"
once_cell = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Pin for async futures
pin-project = "1"

# Bytes type for streaming bodies
bytes = "1"

# Type utilities
dashmap = "5"

# Regex for pattern matching
regex = "1"

# File watcher for config hot-reload
notify = "7"
serde_yaml = "0.9"

# WASM runtime (always available — agents run in WASM by default)
wasmtime = "20"
wat = "1"

# Hashing for package integrity
sha2 = "0.10"

# Encryption for config storage
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"

# Hashing for 1Panel auth
md5 = "0.7"

# A2A protocol (official SDK)
a2a-lf = "0.3"
a2a-server-lf = "0.4"

# Prometheus metrics (for lobe observability, opt-in via feature flag)
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.16", optional = true }
axum = { version = "0.8", features = ["ws", "multipart"] }
a2a-client-lf = "0.2"

# Async stream utilities
async-stream = "0.3"
tokio-stream = "0.1"

# OpenTelemetry (optional, enabled by feature flag)
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace"], optional = true }
opentelemetry-semantic-conventions = { version = "0.32", optional = true }

# OpenZiti (optional, enabled by feature flag — zero-trust transport)
# ⚠️ v2：线路层**自建** ⇒ ⇒ 不再依赖第三方 ziti-sdk（那套说的是 v1 协议：
#    WebSocket + 无 magic 的自制帧）。
# ⇒ ⇒ **2026-11-05**：v2 实现在**另一个仓**（`iBLOC/ziti-rust` 的第二个 crate
# `ziti-v2`）⇒ ⇒ 这里是 **path 依赖**（iBLOC 全栈都是 path 工作区 ⇒ ⇒
# CI 把兄弟仓 checkout 到工作区子目录，见 .github/workflows/ci.yml）⇒ ⇒
# 本仓的 `transport::ziti::v2` 只是一个 **re-export 门面** ⇒ ⇒
# 调用方的路径**零变化**。
# ⚠️ 线路层实现在 `iBLOC/ziti-rust` 的第二个 crate（`ziti-v2`）—— 自建 v2
#    线路层（magic 帧 + 60783+ 内容类型）⇒ ⇒ **不依赖**第三方 ziti-sdk。
ziti-v2 = { path = "../ziti-rust/crates/ziti-v2", optional = true }
rustls = { version = "0.23", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls-pemfile = { version = "2", optional = true }
rustls-pki-types = { version = "1", optional = true }
hyper = { version = "1", features = ["client", "server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
tower = { version = "0.5", optional = true }
http-body-util = { version = "0.1", optional = true }
# ⚠️ **0.29** —— 与 axum 0.8.9 的 `ws` feature **同一个 crate 实例**
# （axum 0.8.9 → tokio-tungstenite 0.29）⇒ ⇒ 不增加编译量 ⇒ ⇒
# 而且 axum 的 `extract::ws::Message` 与 tungstenite 的 `Message` 才是
# 同一套协议类型 ⇒ ⇒ 代理里的帧转换是显式映射，不是跨版本硬转。
tokio-tungstenite = { version = "0.29", optional = true }

# ACP (Agent Client Protocol) — let Synapse drive external ACP-speaking
# coding agents (opencode, claude-code-acp, codex-acp, …) over stdio.
# Gated by `feature = "acp"`: pulls the official rust-sdk and tokio-process.
agent-client-protocol = { version = "2.2", optional = true }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1"
tempfile = "3"
# 裸 TLS 探针要用：直接建 rustls 客户端配置，抓 edge router 的原始字节。
# ⚠️ 版本与 Cargo.lock 里已有的一致（rustls 0.23 / tokio-rustls 0.26）⇒ 离线可解析。
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
rustls-pki-types = "1"

[features]
default = []
metrics = [
    "dep:metrics",
    "dep:metrics-exporter-prometheus",
]
opentelemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
]
# Zero-trust transport over OpenZiti. Off by default — most callers
# don't need it. Enable with `--features ziti` to use the
# `transport::ziti` module for A2A-over-dark-service and
# HTTP-over-ziti-stream dark services.
ziti = [
    "dep:ziti-v2",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-pemfile",
    "dep:rustls-pki-types",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tower",
    "dep:http-body-util",
    "dep:tokio-tungstenite",
]
# Drive external ACP agents (opencode, claude-code-acp, codex-acp, …).
# Off by default — callers opt in. Non-wasm only (the upstream SDK does
# not expose AcpAgent/Stdio on `target_arch = "wasm32"`).
acp = ["dep:agent-client-protocol"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full", "sync"] }
reqwest = { version = "0.13", features = ["json", "stream", "multipart"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }
wasi = "0.14"
pollster = "0.4"
